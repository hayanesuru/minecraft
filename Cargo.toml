[workspace]
members = [
    "haya_collection",
    "minecraft_data",
    "haya_ecs",
    "haya_ident",
    "haya_math",
    "haya_mutf8",
    "haya_nbt",
    "haya_palette",
    "haya_protocol",
    "mser",
    "mser_macro",
    "haya_str",
]
resolver = "3"

[workspace.package]
authors = ["hayanesuru <hayanesuru@outlook.jp>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hayanesuru/minecraft"
edition = "2024"
publish = ["hayane"]

[workspace.dependencies]
mser = { registry = "hayane", path = "mser", version = "4.1", default-features = false }
mser_macro = { registry = "hayane", path = "mser_macro", version = "4.1", default-features = false }
minecraft_data = { registry = "hayane", path = "minecraft_data", version = "4.2", default-features = false }
haya_nbt = { registry = "hayane", path = "haya_nbt", version = "3" }
haya_str = { registry = "hayane", path = "haya_str", version = "1" }
haya_ident = { registry = "hayane", path = "haya_ident", version = "2" }
haya_mutf8 = { registry = "hayane", path = "haya_mutf8", version = "1" }
haya_math = { registry = "hayane", path = "haya_math", version = "2", default-features = false }
haya_collection = { registry = "hayane", path = "haya_collection", version = "2" }
uuid = { version = "1", default-features = false }

[profile.dev.package."minecraft_data"]
incremental = false

[profile.dev.package."mser_macro"]
incremental = false
opt-level = 3
strip = true
debug = false
